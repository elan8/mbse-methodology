name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate method (spec42 checks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mbse-methodology
        uses: actions/checkout@v6

      - name: Checkout Spec42
        uses: actions/checkout@v6
        with:
          repository: elan8/spec42
          path: spec42

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: spec42

      - name: Build spec42 CLI
        working-directory: spec42
        run: cargo build --release -p spec42

      - name: spec42 check (library, template, examples)
        env:
          SPEC42_EXE: ${{ github.workspace }}/spec42/target/release/spec42
        run: python3 scripts/validate_spec42.py

      - name: Recipe example fences parse cleanly
        env:
          SPEC42_EXE: ${{ github.workspace }}/spec42/target/release/spec42
        run: python3 scripts/check_recipe_fences.py

      - name: Library definitions are referenced outside library/
        run: python3 scripts/check_unused_library_defs.py
