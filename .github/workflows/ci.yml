name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate method (spec42 checks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mbse-methodology
        uses: actions/checkout@v6

      # scripts/_spec42.py downloads and caches the release pinned in
      # .spec42-version on first use (see that file's comment for why: not
      # the elan8/spec42 composite action, not a from-source build). Cache
      # the download dir across runs so it only actually hits the network
      # once per spec42 version bump, not once per CI run.
      - name: Cache spec42 download
        uses: actions/cache@v4
        with:
          path: ~/.cache/elan8/spec42
          key: spec42-${{ runner.os }}-${{ hashFiles('.spec42-version') }}

      - name: spec42 check (library, template, examples)
        run: python3 scripts/validate_spec42.py

      - name: Recipe example fences parse cleanly
        run: python3 scripts/check_recipe_fences.py

      - name: Library definitions are referenced outside library/
        run: python3 scripts/check_unused_library_defs.py
